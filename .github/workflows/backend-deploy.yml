name: Deploy Backend to Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
        
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Run tests (if any)
      run: |
        cd backend
        # Add test command here if you have tests
        echo "No tests configured"
        
    - name: Trigger Render Deploy (manual runs only)
      # Render's native GitHub integration already auto-deploys on push
      # to master, so the deploy-hook curl is redundant on push events
      # and would cause double-deploys. Gate it to workflow_dispatch so
      # the "Run workflow" button in the Actions UI is the only way it
      # fires — useful for forcing a redeploy without a new commit
      # (e.g. after rotating secrets or recovering from a Render
      # deploy that errored out mid-build).
      if: github.event_name == 'workflow_dispatch'
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
